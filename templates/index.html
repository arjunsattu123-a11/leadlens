<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LeadLens — AI Company Enrichment</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #f7a26a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* Ambient glow */
  .glow-orb {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,106,247,0.08) 0%, transparent 70%);
    pointer-events: none;
    top: -200px; left: -100px;
  }
  .glow-orb2 {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247,162,106,0.06) 0%, transparent 70%);
    pointer-events: none;
    bottom: -100px; right: -100px;
  }

  /* Layout */
  .wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-mark {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: white;
    flex-shrink: 0;
  }
  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
  }
  .logo-text span { color: var(--accent); }
  .tagline {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }

  /* Main sections */
  main {
    padding: 40px 0 80px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* Section card */
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  .section-card:nth-child(2) { animation-delay: 0.1s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .icon-purple { background: rgba(124,106,247,0.15); }
  .icon-orange { background: rgba(247,162,106,0.15); }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.3px;
  }
  .section-body { padding: 28px; }

  /* Form elements */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  input[type="text"], input[type="url"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.12);
  }
  input::placeholder { color: var(--muted); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--radius);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6c5ce7);
    color: white;
    box-shadow: 0 4px 20px rgba(124,106,247,0.3);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(124,106,247,0.4);
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

  /* Status indicator */
  .status-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    margin-top: 16px;
    animation: fadeUp 0.3s ease;
  }
  .status-bar.show { display: flex; }
  .status-bar.loading { background: rgba(124,106,247,0.1); border: 1px solid rgba(124,106,247,0.3); color: var(--accent); }
  .status-bar.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); }
  .status-bar.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(124,106,247,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result card */
  .result-display {
    display: none;
    margin-top: 24px;
  }
  .result-display.show { display: block; }

  .result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: fadeUp 0.4s ease;
  }
  .result-card-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(124,106,247,0.1), rgba(247,162,106,0.05));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .company-name-display {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
  }
  .source-url {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }
  .badge {
    background: rgba(74,222,128,0.15);
    color: var(--success);
    border: 1px solid rgba(74,222,128,0.3);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }

  .result-field {
    background: var(--surface2);
    padding: 14px 18px;
  }
  .result-field.full-width {
    grid-column: 1 / -1;
    border-top: 1px solid var(--border);
  }
  .field-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .field-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
  }
  .field-value.mono { font-family: 'DM Mono', monospace; font-size: 12px; }
  .tag {
    display: inline-block;
    background: rgba(124,106,247,0.12);
    color: var(--accent);
    border: 1px solid rgba(124,106,247,0.25);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    margin: 2px 3px 2px 0;
  }
  .na { color: var(--muted); font-style: italic; }

  .outreach-box {
    background: rgba(247,162,106,0.06);
    border: 1px solid rgba(247,162,106,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    font-style: italic;
  }

  /* Results table section */
  .table-wrapper {
    overflow-x: auto;
    margin-top: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 700px;
  }
  thead tr {
    background: var(--surface2);
    border-bottom: 2px solid var(--border);
  }
  th {
    text-align: left;
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }
  tbody tr:hover { background: rgba(124,106,247,0.05); }
  td {
    padding: 12px 16px;
    vertical-align: top;
    line-height: 1.5;
    max-width: 220px;
  }
  td .muted { color: var(--muted); font-size: 12px; }
  td .mono { font-family: 'DM Mono', monospace; font-size: 12px; }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Detail modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 640px;
    max-height: 80vh;
    overflow-y: auto;
    animation: fadeUp 0.25s ease;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 24px; }
  .close-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    padding: 6px 10px;
    font-size: 16px;
    transition: all 0.2s;
  }
  .close-btn:hover { color: var(--text); border-color: var(--accent); }

  .count-badge {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: rgba(124,106,247,0.15);
    color: var(--accent);
    border-radius: 20px;
    padding: 3px 10px;
    margin-left: 10px;
  }
</style>
</head>
<body>
<div class="glow-orb"></div>
<div class="glow-orb2"></div>

<div class="wrapper">
  <header>
    <div class="header-inner">
      <div class="logo-mark">L</div>
      <div>
        <div class="logo-text">Lead<span>Lens</span></div>
        <div class="tagline">AI-powered B2B company intelligence</div>
      </div>
    </div>
  </header>

  <main>
    <!-- Enrich Section -->
    <div class="section-card">
      <div class="section-header">
        <div class="section-icon icon-purple">🔍</div>
        <div>
          <div class="section-title">Enrich Company</div>
        </div>
      </div>
      <div class="section-body">
        <div class="form-row">
          <div class="field">
            <label>Website Name</label>
            <input type="text" id="websiteName" placeholder="e.g. Acme Corp" />
          </div>
          <div class="field">
            <label>Company URL</label>
            <input type="url" id="companyUrl" placeholder="https://example.com" />
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="enrichBtn" onclick="enrichCompany()">
            <span>✦</span> Enrich Company
          </button>
          <button class="btn btn-secondary" onclick="clearEnrich()">Clear</button>
        </div>

        <div class="status-bar" id="statusBar">
          <div class="spinner" id="statusSpinner" style="display:none"></div>
          <span id="statusText"></span>
        </div>

        <div class="result-display" id="resultDisplay"></div>
      </div>
    </div>

    <!-- Results Section -->
    <div class="section-card">
      <div class="section-header">
        <div class="section-icon icon-orange">📊</div>
        <div style="flex:1">
          <div class="section-title">
            All Results
            <span class="count-badge" id="countBadge">0</span>
          </div>
        </div>
        <button class="btn btn-secondary" onclick="loadResults()">↻ Refresh</button>
      </div>
      <div class="section-body" style="padding-top:16px">
        <div id="resultsContainer">
          <div class="empty-state">
            <div class="icon">🔭</div>
            <p>No results yet. Enrich a company to get started.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="section-title" id="modalTitle">Company Details</span>
      <button class="close-btn" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // Load results on page load
  window.addEventListener('DOMContentLoaded', loadResults);

  function setStatus(type, msg, spinner = false) {
    const bar = document.getElementById('statusBar');
    const text = document.getElementById('statusText');
    const sp = document.getElementById('statusSpinner');
    bar.className = 'status-bar show ' + type;
    text.textContent = msg;
    sp.style.display = spinner ? 'block' : 'none';
  }

  function hideStatus() {
    document.getElementById('statusBar').className = 'status-bar';
  }

  async function enrichCompany() {
    const url = document.getElementById('companyUrl').value.trim();
    const name = document.getElementById('websiteName').value.trim();

    if (!url) { setStatus('error', '⚠ Please enter a company URL.'); return; }

    const btn = document.getElementById('enrichBtn');
    btn.disabled = true;
    document.getElementById('resultDisplay').className = 'result-display';
    setStatus('loading', 'Scraping website and running AI enrichment…', true);

    try {
      const res = await fetch('/enrich', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, website_name: name })
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus('error', '✕ ' + (data.error || 'Enrichment failed.'));
        return;
      }

      setStatus('success', '✓ Enrichment complete!');
      renderResult(data, 'resultDisplay');
      loadResults();
    } catch (e) {
      setStatus('error', '✕ Network error: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function clearEnrich() {
    document.getElementById('companyUrl').value = '';
    document.getElementById('websiteName').value = '';
    document.getElementById('resultDisplay').className = 'result-display';
    hideStatus();
  }

  function renderResult(d, containerId) {
    const c = document.getElementById(containerId);
    const emails = Array.isArray(d.mail) ? d.mail : (d.mail ? [d.mail] : []);
    const emailHtml = emails.length
      ? emails.map(e => `<span class="tag">${e}</span>`).join('')
      : '<span class="na">N/A</span>';

    c.className = (containerId === 'resultDisplay') ? 'result-display show' : '';
    c.innerHTML = `
      <div class="result-card">
        <div class="result-card-header">
          <div>
            <div class="company-name-display">${esc(d.company_name || d.website_name || 'Unknown')}</div>
            <div class="source-url">${esc(d.source_url || '')}</div>
          </div>
          <span class="badge">✓ Enriched</span>
        </div>
        <div class="result-grid">
          <div class="result-field">
            <div class="field-label">Website Name</div>
            <div class="field-value mono">${esc(d.website_name || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field">
            <div class="field-label">Phone</div>
            <div class="field-value mono">${esc(d.mobile_number || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field full-width">
            <div class="field-label">Address</div>
            <div class="field-value">${esc(d.address || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field full-width">
            <div class="field-label">Email(s)</div>
            <div class="field-value">${emailHtml}</div>
          </div>
          <div class="result-field">
            <div class="field-label">Core Service</div>
            <div class="field-value">${esc(d.core_service || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field">
            <div class="field-label">Target Customer</div>
            <div class="field-value">${esc(d.target_customer || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field full-width">
            <div class="field-label">Probable Pain Point</div>
            <div class="field-value">${esc(d.probable_pain_point || '') || '<span class="na">N/A</span>'}</div>
          </div>
          <div class="result-field full-width">
            <div class="field-label">Outreach Opener</div>
            <div class="field-value"><div class="outreach-box">${esc(d.outreach_opener || '') || '<span class="na">N/A</span>'}</div></div>
          </div>
        </div>
      </div>`;
  }

  async function loadResults() {
    try {
      const res = await fetch('/results');
      const data = await res.json();
      document.getElementById('countBadge').textContent = data.length;
      renderTable(data);
    } catch (e) {
      document.getElementById('resultsContainer').innerHTML =
        `<div class="empty-state"><p style="color:var(--error)">Failed to load results.</p></div>`;
    }
  }

  function renderTable(data) {
    const container = document.getElementById('resultsContainer');
    if (!data.length) {
      container.innerHTML = `<div class="empty-state"><div class="icon">🔭</div><p>No results yet. Enrich a company to get started.</p></div>`;
      return;
    }
    container.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Company</th>
              <th>Core Service</th>
              <th>Email(s)</th>
              <th>Phone</th>
              <th>Target Customer</th>
            </tr>
          </thead>
          <tbody>
            ${data.map((d, i) => {
              const emails = Array.isArray(d.mail) ? d.mail : (d.mail ? [d.mail] : []);
              return `<tr onclick="showModal(${i})" title="Click for full details">
                <td class="muted mono">${i + 1}</td>
                <td>
                  <div style="font-weight:600">${esc(d.company_name || d.website_name || '—')}</div>
                  <div class="muted mono">${esc(truncate(d.source_url || '', 35))}</div>
                </td>
                <td>${esc(truncate(d.core_service || '—', 50))}</td>
                <td>${emails.length ? emails.map(e => `<span class="tag">${esc(e)}</span>`).join('') : '<span class="muted">—</span>'}</td>
                <td class="mono">${esc(d.mobile_number || '') || '<span class="muted">—</span>'}</td>
                <td>${esc(truncate(d.target_customer || '—', 50))}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    window._resultsData = data;
  }

  function showModal(idx) {
    const d = window._resultsData[idx];
    if (!d) return;
    document.getElementById('modalTitle').textContent = d.company_name || d.website_name || 'Company Details';
    const tmp = document.createElement('div');
    renderResult(d, tmp.id = '_modalTmp');
    document.body.appendChild(tmp);
    document.getElementById('modalBody').innerHTML = tmp.querySelector('.result-card').outerHTML;
    document.body.removeChild(tmp);
    document.getElementById('detailModal').className = 'modal-overlay show';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('detailModal')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('detailModal').className = 'modal-overlay';
  }

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }

  // Allow Enter key in URL field
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('companyUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') enrichCompany();
    });
  });
</script>
